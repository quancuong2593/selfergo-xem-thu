<!doctype html>
<html lang="vi" data-bo="fable-a">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F6E5B6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Nền của bộ phủ cả vùng thanh trạng thái (#20); toạ độ dọc bù bằng --lech-tren. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SelfErgo" />
    <link rel="apple-touch-icon" href="/selfergo-xem-thu/xem-thu/bieu-tuong-180.png" />
    <title>SelfErgo</title>
    <!-- Khung hình đầu tiên đúng nền của bộ, trước khi CSS và JS chính tải (mang-4 mục 1.10).
         Màu phải trùng --nen và --nen-day trong src/bo-man-hinh/<id>/token.css; npm run kiem-tra
         so hai nơi. background-color đặc tô vùng ngoài trang trên iOS (#38). -->
    <style>html[data-bo=fable-a]{background:#ecc478 linear-gradient(#f6e5b6 0%,#f2d594 55%,#ecc478 100%)}html[data-bo=lat-the]{background:#e9bd9e linear-gradient(#f6e3d3 0%,#f0d0b8 60%,#e9bd9e 100%)}html[data-bo=khung-tranh]{background:#e8e5de linear-gradient(#f0eee9 0%,#e8e5de 100%)}html[data-bo=tam-ve]{background:#dfd2bd linear-gradient(#e9dfcf 0%,#dfd2bd 100%)}html{min-height:100%}</style>
    <script>
      (function () {
        var m = {
          'fable-a': '#F6E5B6',
          'lat-the': '#F6E3D3',
          'khung-tranh': '#F0EEE9',
          'tam-ve': '#E9DFCF',
        };
        var b = 'fable-a';
        try {
          var s = localStorage.getItem('selfergo.bo');
          if (s && m[s]) b = s;
        } catch (e) {}
        // Máy tính luôn vẽ fable-a (mang-4 mục 1.13). Số 900 trùng DIEM_GAY_MAY_TINH, kiem-tra so.
        if (window.matchMedia && window.matchMedia('(min-width: 900px)').matches) {
          b = 'fable-a';
          document.documentElement.setAttribute('data-may-tinh', '');
        }
        document.documentElement.setAttribute('data-bo', b);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', m[b]);
        window.__selfergoMauDau = m;
      })();
    </script>
    <script type="module" crossorigin src="/selfergo-xem-thu/xem-thu/assets/index-y7Hbnbwm.js"></script>
    <link rel="stylesheet" crossorigin href="/selfergo-xem-thu/xem-thu/assets/index-CFtgwmHp.css">
  <link rel="manifest" href="/selfergo-xem-thu/xem-thu/manifest.webmanifest"></head>
  <body>
    <div id="app"></div>
  </body>
</html>
