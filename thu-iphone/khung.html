<!doctype html>
<html lang="vi">
  <head>
    <!-- Trang đo vệt trắng ở đáy lúc mở từ biểu tượng (#25). Phần đầu giống hệt app:
         viewport, thanh trạng thái, ảnh khởi động, nền gradient mẫu A trên html. -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#F6E5B6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Đo khung" />
    <link rel="apple-touch-icon" href="bieu-tuong-180.png" />
    <link
      rel="apple-touch-startup-image"
      href="../xem-thu/khoi-dong-1080x2340.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <title>Đo khung màn hình</title>
    <style>
      html {
        background: linear-gradient(180deg, #f6e5b6 0%, #f2d594 55%, #ecc478 100%);
        min-height: 100%;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        position: relative;
        font: 12px/1.4 ui-monospace, Menlo, monospace;
        color: #2b261e;
      }
      /* Vạch đỏ ở đáy hộp html: dưới vạch mà còn màu nhạt là gradient lặp lại (hộp html thấp
         hơn màn hình); trắng hẳn là ngoài khung web của iOS. */
      html::after {
        content: '';
        display: block;
        height: 3px;
        background: #d22;
        margin-top: -3px;
      }
      main {
        padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 16px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      #do {
        white-space: pre-wrap;
        margin: 0;
      }
      button {
        font: inherit;
        padding: 8px 12px;
        margin: 8px 0;
      }
      .tham-do {
        position: absolute;
        left: 0;
        top: 0;
        width: 1px;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Đo khung màn hình (vệt trắng ở đáy)</h1>
      <p>Mở từ biểu tượng. Nhìn đáy màn hình: có vệt không, màu gì, nằm trên hay dưới vạch đỏ? Vuốt thử, rồi bấm Chép.</p>
      <button type="button" id="chep">Chép kết quả</button>
      <pre id="do"></pre>
    </main>
    <div class="tham-do" id="vh" style="height: 100vh"></div>
    <div class="tham-do" id="dvh" style="height: 100dvh"></div>
    <div class="tham-do" id="lvh" style="height: 100lvh"></div>
    <div class="tham-do" id="svh" style="height: 100svh"></div>
    <div class="tham-do" id="tren" style="height: env(safe-area-inset-top, 0px)"></div>
    <div class="tham-do" id="duoi" style="height: env(safe-area-inset-bottom, 0px)"></div>
    <script>
      'use strict';
      var dong = [];
      var batDau = Date.now();
      var cao = function (id) {
        var el = document.getElementById(id);
        return el ? Math.round(el.getBoundingClientRect().height) : '?';
      };
      function do_(luc) {
        var vv = window.visualViewport;
        var html = document.documentElement;
        dong.push(
          '[' + ((Date.now() - batDau) / 1000).toFixed(1) + ' giây · ' + luc + ']\n' +
            '  man hinh ' + screen.width + '×' + screen.height +
            ' · innerHeight ' + window.innerHeight +
            ' · visualViewport ' + (vv ? Math.round(vv.height) + ' (lệch ' + Math.round(vv.offsetTop) + ')' : 'không có') +
            '\n  html ' + html.getBoundingClientRect().height.toFixed(0) +
            ' · clientHeight ' + html.clientHeight +
            ' · body ' + document.body.getBoundingClientRect().height.toFixed(0) +
            ' · cuộn ' + Math.round(window.scrollY) +
            '\n  100vh ' + cao('vh') + ' · dvh ' + cao('dvh') + ' · lvh ' + cao('lvh') + ' · svh ' + cao('svh') +
            ' · an toàn trên ' + cao('tren') + ' dưới ' + cao('duoi') +
            '\n  màn hình chính: ' + (navigator.standalone === true || matchMedia('(display-mode: standalone)').matches)
        );
        document.getElementById('do').textContent = dong.join('\n');
      }
      do_('mở trang');
      addEventListener('load', function () {
        do_('load');
        setTimeout(function () { do_('sau load 1 giây'); }, 1000);
      });
      var lan = 0;
      ['resize', 'scroll', 'touchend'].forEach(function (loai) {
        addEventListener(loai, function () {
          if (lan++ < 12) do_(loai);
        }, { passive: true });
      });
      if (window.visualViewport) visualViewport.addEventListener('resize', function () { if (lan++ < 12) do_('visualViewport resize'); });
      document.getElementById('chep').addEventListener('click', function () {
        var t = '# Đo khung màn hình\n' + navigator.userAgent + '\n\n' + dong.join('\n');
        if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { do_('đã chép'); }, function () { do_('chép lỗi'); });
      });
    </script>
  </body>
</html>
