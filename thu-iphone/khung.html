<!doctype html>
<html lang="vi">
  <head>
    <!-- Trang đo vệt trắng ở đáy lúc mở từ biểu tượng (#25). Phần đầu giống hệt app:
         viewport, thanh trạng thái, ảnh khởi động, nền gradient mẫu A trên html. -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#F6E5B6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Đo khung" />
    <link rel="apple-touch-icon" href="bieu-tuong-180.png" />
    <link
      rel="apple-touch-startup-image"
      href="../xem-thu/khoi-dong-1080x2340.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <title>Đo khung màn hình</title>
    <style>
      html {
        background: linear-gradient(180deg, #f6e5b6 0%, #f2d594 55%, #ecc478 100%);
        min-height: 100%;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        position: relative;
        font: 12px/1.4 ui-monospace, Menlo, monospace;
        color: #2b261e;
      }
      /* Vạch đỏ ở đáy hộp html: dưới vạch mà còn màu nhạt là gradient lặp lại (hộp html thấp
         hơn màn hình); trắng hẳn là ngoài khung web của iOS. */
      html::after {
        content: '';
        display: block;
        height: 3px;
        background: #d22;
        margin-top: -3px;
      }
      main {
        padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 16px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      #do {
        white-space: pre-wrap;
        margin: 0;
      }
      button {
        font: inherit;
        padding: 8px 12px;
        margin: 8px 0;
      }
      /* Cách 3 (#31): nền nằm trên lớp cố định cao 100lvh, không trên html. */
      .lop-nen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 100vh;
        height: 100lvh;
        z-index: -1;
        pointer-events: none;
        background: linear-gradient(180deg, #f6e5b6 0%, #f2d594 55%, #ecc478 100%);
      }
      .tham-do {
        position: absolute;
        left: 0;
        top: 0;
        width: 1px;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Đo khung màn hình (vệt trắng ở đáy)</h1>
      <p>Mở từ biểu tượng. Nhìn đáy màn hình: có vệt không, màu gì, nằm trên hay dưới vạch đỏ? Vuốt thử, rồi bấm Chép.</p>
      <p>
        Cách sửa (#29, #31), bật rồi <b>tắt hẳn app, mở lại từ biểu tượng</b>:<br />
        <label><input type="checkbox" id="cach-1" /> 1. Cuộn 1 điểm rồi về 0, khi thấy khung thấp hơn màn hình</label><br />
        <label><input type="checkbox" id="cach-2" /> 2. Kèm: body cao hơn khung 1 điểm trong một khung hình (cho trang không cuộn được)</label><br />
        <label><input type="checkbox" id="cach-3" /> 3. Nền trên lớp cố định cao 100lvh thay vì trên html</label><br />
        <label><input type="checkbox" id="khoa-cuon" /> Giống app: trang không cuộn được (html, body cao đúng khung, overflow hidden)</label>
      </p>
      <button type="button" id="chep">Chép kết quả</button>
      <pre id="do"></pre>
    </main>
    <div class="tham-do" id="vh" style="height: 100vh"></div>
    <div class="tham-do" id="dvh" style="height: 100dvh"></div>
    <div class="tham-do" id="lvh" style="height: 100lvh"></div>
    <div class="tham-do" id="svh" style="height: 100svh"></div>
    <div class="tham-do" id="tren" style="height: env(safe-area-inset-top, 0px)"></div>
    <div class="tham-do" id="duoi" style="height: env(safe-area-inset-bottom, 0px)"></div>
    <script>
      'use strict';
      var dong = [];
      // Công tắc lưu trên máy: cách sửa chỉ thử được lúc mở app từ biểu tượng.
      var CONG_TAC = ['cach-1', 'cach-2', 'cach-3', 'khoa-cuon'];
      var daChay = []; // cách nào đã chạy, ghi vào mỗi dòng đo
      var bat = {};
      CONG_TAC.forEach(function (id) {
        try { bat[id] = localStorage.getItem('khung.' + id) === '1'; } catch (e) { bat[id] = false; }
        var o = document.getElementById(id);
        o.checked = bat[id];
        o.addEventListener('change', function () {
          try { localStorage.setItem('khung.' + id, o.checked ? '1' : '0'); } catch (e) {}
        });
      });
      if (bat['khoa-cuon']) {
        var k = document.createElement('style');
        k.textContent = 'html,body{height:100%;min-height:0;overflow:hidden}';
        document.head.appendChild(k);
      }
      if (bat['cach-3']) {
        document.documentElement.style.background = 'none';
        var lop = document.createElement('div');
        lop.className = 'lop-nen';
        document.body.insertBefore(lop, document.body.firstChild);
        daChay.push('cách 3');
      }
      var batDau = Date.now();
      function laManHinhChinh() {
        return navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
      }
      var cao = function (id) {
        var el = document.getElementById(id);
        return el ? Math.round(el.getBoundingClientRect().height) : '?';
      };
      function do_(luc) {
        var vv = window.visualViewport;
        var html = document.documentElement;
        dong.push(
          '[' + Math.round(performance.now()) + ' ms từ lúc mở · ' + luc + ']\n' +
            '  man hinh ' + screen.width + '×' + screen.height +
            ' · innerHeight ' + window.innerHeight +
            ' · visualViewport ' + (vv ? Math.round(vv.height) + ' (lệch ' + Math.round(vv.offsetTop) + ')' : 'không có') +
            '\n  html ' + html.getBoundingClientRect().height.toFixed(0) +
            ' · clientHeight ' + html.clientHeight +
            ' · body ' + document.body.getBoundingClientRect().height.toFixed(0) +
            ' · cuộn ' + Math.round(window.scrollY) +
            '\n  100vh ' + cao('vh') + ' · dvh ' + cao('dvh') + ' · lvh ' + cao('lvh') + ' · svh ' + cao('svh') +
            ' · an toàn trên ' + cao('tren') + ' dưới ' + cao('duoi') +
            '\n  màn hình chính: ' + laManHinhChinh() +
            ' · cách đã chạy: ' + (daChay.length ? daChay.join(', ') : 'không')
        );
        document.getElementById('do').textContent = dong.join('\n');
      }
      do_('mở trang (công tắc: ' + CONG_TAC.filter(function (id) { return bat[id]; }).join(', ') + ')');

      // Cách 1 (và 2): một cú cuộn 1 điểm rồi trả về, để iOS dựng lại khung web cho đủ cao (#29).
      var daSua = false;
      function sua(vi) {
        if (daSua || !bat['cach-1']) return;
        // Dấu hiệu (#31): mở từ màn hình chính mà khung (innerHeight) thấp hơn màn hình. Ở chế độ
        // "giống app" innerHeight đứng yên 762, nên không dựa vào clientHeight < innerHeight được.
        var thap = window.innerHeight < screen.height || cao('lvh') > window.innerHeight;
        if (!laManHinhChinh() || !thap) {
          do_('chưa cần sửa lúc ' + vi);
          return;
        }
        daSua = true;
        requestAnimationFrame(function () {
          var body = document.body;
          var cu = body.style.minHeight;
          if (bat['cach-2']) body.style.minHeight = 'calc(100% + 1px)';
          window.scrollTo(0, 1);
          window.scrollTo(0, 0);
          daChay.push(bat['cach-2'] ? 'cách 1 + 2 lúc ' + vi : 'cách 1 lúc ' + vi);
          if (bat['cach-2']) {
            requestAnimationFrame(function () { body.style.minHeight = cu; do_('vừa sửa'); });
          } else {
            do_('vừa sửa');
          }
        });
      }
      addEventListener('resize', function () { sua('resize'); });
      addEventListener('load', function () {
        do_('load');
        sua('load');
        setTimeout(function () { sua('1 phách sau load'); }, 420);
        setTimeout(function () { do_('sau load 1 giây'); }, 1000);
      });
      var lan = 0;
      ['resize', 'scroll', 'touchend'].forEach(function (loai) {
        addEventListener(loai, function () {
          if (lan++ < 12) do_(loai);
        }, { passive: true });
      });
      if (window.visualViewport) visualViewport.addEventListener('resize', function () { if (lan++ < 12) do_('visualViewport resize'); });
      document.getElementById('chep').addEventListener('click', function () {
        var t = '# Đo khung màn hình\n' + navigator.userAgent + '\n\n' + dong.join('\n');
        if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { do_('đã chép'); }, function () { do_('chép lỗi'); });
      });
    </script>
  </body>
</html>
